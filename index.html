<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klamotten Büro</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:15px}h1{margin-top:0}.top{display:flex;gap:8px;margin-bottom:15px}input{flex:1;padding:10px}button{padding:10px;border:1px solid #999;background:#fff}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ccc}.name{min-width:150px}.controls{display:flex;gap:8px;align-items:center}.qty{min-width:24px;text-align:center;font-weight:bold}</style></head><body><h1>Klamotten Büro</h1><div class="top"><input id="newItem" placeholder="Neuer Artikel"><button id="addBtn">Hinzufügen</button></div><div id="list"></div><script>const KEY='klamotten_buero';let items=JSON.parse(localStorage.getItem(KEY))||[{name:'Unterhose',qty:2},{name:'T-Shirt',qty:1},{name:'Socken',qty:3}];function save(){localStorage.setItem(KEY,JSON.stringify(items));render();}function render(){const list=document.getElementById('list');list.innerHTML='';items.forEach((item,index)=>{const row=document.createElement('div');row.className='row';const name=document.createElement('div');name.className='name';name.contentEditable=true;name.textContent=item.name;name.addEventListener('blur',()=>{const v=name.textContent.trim();if(v){items[index].name=v;localStorage.setItem(KEY,JSON.stringify(items));}});const controls=document.createElement('div');controls.className='controls';const minus=document.createElement('button');minus.textContent='-';minus.onclick=()=>{items[index].qty=Math.max(0,items[index].qty-1);save();};const qty=document.createElement('span');qty.className='qty';qty.textContent=item.qty;const plus=document.createElement('button');plus.textContent='+';plus.onclick=()=>{items[index].qty++;save();};const del=document.createElement('button');del.textContent='Löschen';del.onclick=()=>{items.splice(index,1);save();};controls.append(minus,qty,plus,del);row.append(name,controls);list.appendChild(row);});}document.getElementById('addBtn').addEventListener('click',()=>{const input=document.getElementById('newItem');const value=input.value.trim();if(!value)return;items.push({name:value,qty:0});input.value='';save();});render();</script></body></html>
